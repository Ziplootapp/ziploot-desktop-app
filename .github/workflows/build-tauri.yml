name: Build ZipLoot Desktop Executable (.exe)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'Windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Build ZipLoot Native Executable
        run: npx tauri build

      - name: Upload Windows Executable (.exe / .msi) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZipLoot-Desktop-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
